[project]
name = "django-npm-finder"
version = "2.0.0"
description = "A django staticfiles finder that supporting npm/yarn/pnpm"
authors = [
    {name = "David Nugent", email = "davidn@uniquode.io"},
    {name = "Kevin McCarthy", email = "e@kevinmccarthy.org"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<4.0"
keywords = ["django", "npm", "finder", "staticfiles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "Django>=5.2.17",
]

[project.urls]
Homepage = "https://github.com/deeprave/django-npm-finder"
Repository = "https://github.com/deeprave/django-npm-finder"
Documentation = "https://github.com/deeprave/django-npm-finder"

[tool.ruff]


[dependency-groups]
dev = [
    "ruff>=0.5.2",
    "pytest==9.2.0",
]


[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "django_npm"
module-root = ""
