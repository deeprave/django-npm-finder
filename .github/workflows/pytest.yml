name: Test and Build CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15", "3.14", "3.13"]
        # "locked" is the Django in uv.lock (the latest series, which is where security releases
        # will land); the other entry floats to the highest release of the oldest supported
        # major version
        django: ["locked", "Django>=5.2,<6.0"]

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the tests
        env:
          DJANGO: ${{ matrix.django }}
        run: |
          if [ "${DJANGO}" = "locked" ]; then
            uv run pytest
          else
            uv run --with "${DJANGO}" pytest
          fi

      - name: Build package
        run: uv build
